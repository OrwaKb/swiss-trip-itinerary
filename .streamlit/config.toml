# Streamlit bakes one theme in at deploy time, so this is the Daylight tone — the
# default — and it is what paints for the instant before the stylesheet lands. The
# other three tones, including the two dark ones, are taken back in CSS at runtime.
[theme]
base = "light"
primaryColor = "#B4432A"
backgroundColor = "#E9EFF3"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#14222B"

[browser]
gatherUsageStats = false

[server]
# The photos in static/ are served from the app itself. Nothing is fetched from
# anywhere else at runtime, which keeps the app quick on hotel wifi.
enableStaticServing = true
