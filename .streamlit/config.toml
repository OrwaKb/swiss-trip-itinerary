[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f3f2ee"
secondaryBackgroundColor = "#fcfcfb"
textColor = "#0b0b0b"

[browser]
gatherUsageStats = false

[server]
# The photos in static/ are served from the app itself. Nothing is fetched from
# anywhere else at runtime, which keeps the app quick on hotel wifi.
enableStaticServing = true
